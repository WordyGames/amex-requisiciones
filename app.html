<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FF5808">
<title>Liumaq · Requisiciones</title>
<link rel="manifest" href="/requisiciones.webmanifest">
<link rel="apple-touch-icon" href="/logos/requisiciones-192.png">
<script src="/instalar.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--o:#FF5808;--od:#d94600;--ink:#141414;--mut:#6b6f76;--b:#e4e4e4;--bg:#f3f3f1;--ok:#1a7a3c;--warn:#a8710a;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3,h4,.cond,th,button,.tab{font-family:'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase}
h2{font-size:26px;font-weight:800;margin:0 0 12px}h3{font-size:20px;margin:18px 0 8px}
.top{background:#0f0f0f;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--o)}
.brand{font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:.04em}
.brand small{display:block;font-family:Barlow;font-size:11px;font-weight:500;color:#aaa;letter-spacing:0;text-transform:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{background:transparent;color:#ddd;border:1px solid #333;border-radius:2px;padding:8px 13px;cursor:pointer;font-size:15px}
.tab.on{background:var(--o);border-color:var(--o);color:#fff}
.tab .n{background:#fff;color:var(--o);border-radius:9px;padding:0 6px;margin-left:5px;font-size:12px}
.who{font-size:13px;color:#bbb;text-align:right}.who a{color:var(--o);cursor:pointer;display:block}
.wrap{max-width:1180px;margin:20px auto;padding:0 16px 60px}
.card{background:#fff;border:1px solid var(--b);border-radius:4px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:2px;font-size:14px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.btn{background:var(--o);color:#fff;border:0;border-radius:2px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--od)}.btn.sm{padding:6px 11px;font-size:14px}
.ghost{background:#fff;border:1px solid #ccc;border-radius:2px;padding:8px 13px;cursor:pointer;font-size:14px}
.ghost.sm{padding:5px 9px;font-size:13px}.ghost.bad{color:var(--bad);border-color:var(--bad)}
.req{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#0f0f0f;color:#fff;text-align:left;padding:8px;font-size:13px;font-weight:600}
td{padding:8px;border-bottom:1px solid var(--b);vertical-align:top}
td input,td select{padding:6px;font-size:13px}
.tbl{overflow-x:auto}
.p{display:inline-block;border-radius:3px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:#eee}
.st-por_aprobar{background:#fdf0d5;color:var(--warn)}.st-rechazada{background:#fbe4e1;color:var(--bad)}
.st-por_comprar{background:#fff0e6;color:var(--od)}.st-comprado{background:#e6ecf8;color:#1b3a6b}
.st-en_transito{background:#eee4fb;color:#5b2a9e}.st-parcial{background:#e0f2f1;color:#00695c}
.st-recibido{background:#e3f3e9;color:var(--ok)}.st-cancelada{background:#eee;color:#666}
.urg{background:var(--bad);color:#fff}
.lnk{color:var(--o);font-weight:700;text-decoration:underline;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.bar>div{min-width:180px}
.empty{color:var(--mut);text-align:center;padding:30px}
.err{background:#fbe4e1;color:var(--bad);padding:10px 14px;border-radius:2px;margin-bottom:12px;font-weight:600}
.okmsg{background:#e3f3e9;color:var(--ok);padding:10px 14px;border-radius:2px;margin-bottom:12px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal .card{max-width:900px;width:100%}
.hidden{display:none!important}
.login{max-width:380px;margin:60px auto}
.side{display:grid;grid-template-columns:190px 1fr;gap:14px}
.side .menu button{display:block;width:100%;text-align:left;margin-bottom:5px;background:#fff;border:1px solid var(--b);border-radius:2px;padding:9px 12px;cursor:pointer;font-size:15px}
.side .menu button.on{background:#0f0f0f;color:#fff}
.chk{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:13px}.chk input{width:auto}
@media(max-width:700px){.side{grid-template-columns:1fr}.who{text-align:left}}
</style>
</head>
<body>

<div class="top">
  <div class="brand">LIUMAQ · REQUISICIONES<small>Distribuidor autorizado LiuGong</small></div>
  <div class="tabs" id="tabs"></div>
  <button type="button" class="ghost sm" id="instalar-app" hidden>Instalar app</button>
  <div class="who" id="who"></div>
</div>

<div class="wrap">
  <div id="msg" role="status" aria-live="polite"></div>
  <p id="sync" class="mut hidden" role="status"></p>

  <div id="v-login" class="login card">
    <h2>Entrar</h2>
    <label>Usuario</label><select id="l-user"></select>
    <label>Código</label><input type="password" id="l-code" onkeydown="if(event.key==='Enter')entrar()">
    <br><br><button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
    <p class="mut" id="l-tc"></p>
  </div>

  <div id="v-app" class="hidden"></div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')cerrarModal()"><div class="card" id="modal-body"></div></div>

<script>
const sb = supabase.createClient("https://iwnbscekenptumanpjcs.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bmJzY2VrZW5wdHVtYW5wamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzg2OTQsImV4cCI6MjA5NDg1NDY5NH0.7-YjXYAEXmkKGENNAWc99kplFrq7L8fQbPg1M0AhtNQ",
  { db: { schema: "amex_requisiciones" } });

const ESTATUS = {por_aprobar:"Por aprobar",rechazada:"Rechazada",por_comprar:"Por comprar",comprado:"Comprado",
  en_transito:"En tránsito",parcial:"Recibido parcial",recibido:"Recibido",cancelada:"Cancelada"};
const PERMISOS = {solicitar:"Solicitar",comprar:"Comprar (todo)",comprar_local:"Compra local",recibir:"Recibir (almacén)",aprobar:"Aprobar",consulta:"Consulta",admin:"Admin"};
const EMPRESAS = ["Liumaq","AMEX Machinery"];

let S = null;            // sesión {token,nombre,permisos}
let DATA = [];           // solicitudes
let TC = {};             // tipo de cambio + umbral
let vista = null;

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, cur="MXN") => (cur==="USD"?"US$":"$") + (Number(n)||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const fecha = d => d ? String(d).slice(0,10).split("-").reverse().join("/") : "—";
const tiene = p => S && (S.permisos.includes(p) || S.permisos.includes("admin"));
const pill = st => `<span class="p st-${esc(st)}">${esc(ESTATUS[st]||st)}</span>`;
function aviso(t, ok){
  if(!t){ $("msg").replaceChildren(); return; }
  const mensaje = document.createElement("div");
  mensaje.className = ok ? "okmsg" : "err";
  mensaje.textContent = t;
  $("msg").append(mensaje);
  setTimeout(()=>mensaje.remove(), 5000);
}
async function rpc(fn, args){ const {data,error} = await sb.rpc(fn, args); if(error) throw new Error(error.message); return data; }
function cerrarModal(){ $("modal").classList.add("hidden"); }
function abrirModal(html){ $("modal-body").innerHTML = html; $("modal").classList.remove("hidden"); }

// ---------- login ----------
async function initLogin(){
  try{
    const us = await rpc("usuarios_login_lista");
    $("l-user").innerHTML = us.map(u=>`<option value="${esc(u.nombre)}">${esc(u.nombre)} · ${esc(u.puesto||"")}</option>`).join("") + `<option value="Admin">Admin</option>`;
    TC = await rpc("tc_actual");
    if(TC.valor) $("l-tc").textContent = `Tipo de cambio: $${TC.valor} (${fecha(TC.fecha)})`;
  }catch(e){ aviso("No se pudo conectar: " + e.message); }
}
async function entrar(){
  try{
    S = await rpc("login", { p_nombre: $("l-user").value, p_codigo: $("l-code").value });
    sessionStorage.setItem("liumaq_req", JSON.stringify(S));
    $("l-code").value = "";
    arrancar();
  }catch(e){ aviso(e.message); }
}
function salir(){ sessionStorage.removeItem("liumaq_req"); S=null; location.reload(); }

// ---------- navegación ----------
const pendienteRecepcion = s => ["comprado","en_transito","parcial"].includes(s.estatus);
const cantidadPendiente = n => n===1 ? "1 pedido pendiente" : `${n} pedidos pendientes`;
function menu(){
  const m = [];
  if(["aprobar","comprar","comprar_local","recibir"].some(tiene)) m.push(["trabajo","Mi trabajo"]);
  if(tiene("solicitar")) m.push(["nueva","+ Nueva solicitud"],["mias","Mis solicitudes"]);
  if(tiene("aprobar")) m.push(["aprobar","Por aprobar", DATA.filter(s=>s.estatus==="por_aprobar").length]);
  if(tiene("comprar")) m.push(["comprar","Por comprar", DATA.filter(s=>s.estatus==="por_comprar").length]);
  else if(tiene("comprar_local")) m.push(["local","Compras locales", DATA.filter(esLocalPendiente).length]);
  if(tiene("recibir")) m.push(["recibir","Por recibir"]);
  if(tiene("consulta") || tiene("comprar")) m.push(["osen","Pedidos por OSEN"]);
  if(S.permisos.includes("admin")) m.push(["admin","Admin"]);
  return m;
}
const esLocalPendiente = s => ["por_comprar","comprado","en_transito"].includes(s.estatus) && (!s.tipo || s.tipo==="local");

function pintarTabs(){
  const m = menu();
  if(!m.find(x=>x[0]===vista)) vista = m[0]?.[0];
  $("tabs").innerHTML = m.map(([id,t,n])=>`<button class="tab ${id===vista?'on':''}" onclick="ir('${id}')">${esc(t)}${n?`<span class="n">${n}</span>`:""}</button>`).join("");
  const noLeidos = bandeja.avisos.filter(a=>!a.leido).length;
  $("who").innerHTML = `${esc(S.nombre)}${TC.valor?` · TC $${esc(TC.valor)} · ${esc(TC.fuente||"Fuente sin indicar")} (${fecha(TC.fecha)})`:""}
    <button class="ghost sm" onclick="abrirAvisos()">🔔 Avisos${noLeidos?` (${noLeidos})`:""}</button>
    <button class="ghost sm" onclick="salir()">Salir</button>`;
}
function ir(id){ vista = id; aviso(""); render(); }

async function arrancar(){
  cargarBandeja();
  $("v-login").classList.add("hidden"); $("v-app").classList.remove("hidden");
  await recargar();
}
// ---------- avisos (notificaciones + sonido) ----------
let audioCtx = null, poll = null, ultimaCarga = null, solicitudCarga = 0;
let bandeja = {avisos:[], sonido:false};
let avisosCargados = false, avisosError = false, peticionAvisos = 0;
const claveBandeja = () => "liumaq_avisos_v2:" + S.nombre;
function cargarBandeja(){
  try{
    const guardada = JSON.parse(localStorage.getItem(claveBandeja()));
    bandeja.sonido = guardada?.sonido === true;
  }catch(e){}
}
function guardarBandeja(){
  try{ localStorage.setItem(claveBandeja(), JSON.stringify({sonido:bandeja.sonido})); }catch(e){}
}
async function abrirAvisos(){
  const leidos = bandeja.avisos.filter(a=>!a.leido).map(a=>a.evento);
  await sincronizarAvisos(leidos);
  pintarTabs();
  abrirModal(`<h2>Avisos</h2>
    <button class="ghost sm" onclick="alternarSonido()">Sonido ${bandeja.sonido?"activado":"desactivado"}</button>
    ${avisosError?'<p class="err">No se pudieron sincronizar los avisos.</p>':""}
    ${bandeja.avisos.length?'<ul>'+bandeja.avisos.map(a=>`<li><button class="ghost sm" onclick="verSolicitud(${Number(a.id)})">${esc(a.folio)} · ${esc(a.osen)} · ${esc(ESTATUS[a.estatus]||a.estatus)}</button> <span class="mut">${fecha(a.creado)}</span></li>`).join("")+'</ul>':'<p class="mut">No hay avisos.</p>'}
    <button class="ghost sm" onclick="cerrarModal()">Cerrar</button>`);
}
function accionTrabajo(s){
  if(s.estatus==="por_aprobar" && tiene("aprobar")) return "aprobar";
  if(s.estatus==="por_comprar" && (tiene("comprar") || (tiene("comprar_local") && esLocalPendiente(s)))) return "comprar";
  if(pendienteRecepcion(s) && tiene("recibir")) return "recibir";
  return "";
}
async function alternarSonido(){
  if(bandeja.sonido) bandeja.sonido = false;
  else{
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      await audioCtx.resume();
      bandeja.sonido = true;
      sonar();
    }catch(e){ aviso("El navegador no pudo activar el sonido."); }
  }
  guardarBandeja();
  abrirAvisos();
}
function sonar(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach((t,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value = i?1180:880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+t+0.16);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.17); });
  }catch(e){}
}
async function sincronizarAvisos(leidos=[]){
  const peticion = ++peticionAvisos;
  try{
    const avisos = await rpc("avisos_internos",{p_token:S.token,p_leidos:leidos});
    if(peticion!==peticionAvisos || !S) return;
    const conocidos = new Set(bandeja.avisos.map(a=>a.evento));
    const nuevos = avisos.filter(a=>!a.leido && !conocidos.has(a.evento));
    bandeja.avisos = avisos;
    if(avisosCargados && !leidos.length && nuevos.length){
      if(bandeja.sonido) sonar();
      aviso(nuevos.map(a=>`${a.folio} · ${ESTATUS[a.estatus]||a.estatus}`).slice(0,3).join(" | "),true);
    }
    avisosCargados = true;
    avisosError = false;
  }catch(e){
    if(peticion===peticionAvisos) avisosError = true;
  }
}
function estadoCarga(error){
  const estado = $("sync");
  estado.classList.toggle("hidden", !error && !ultimaCarga);
  const hora = ultimaCarga?.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
  estado.textContent = error ? `No se pudieron actualizar los pedidos.${hora?` Última actualización ${hora}.`:""}` : `Actualizado a las ${hora}`;
  if(error){
    const reintentar = document.createElement("button");
    reintentar.className = "ghost sm";
    reintentar.textContent = "Reintentar";
    reintentar.onclick = sondeo;
    estado.append(" ",reintentar);
  }
}
async function cargarDatos(){
  const numero = ++solicitudCarga;
  try{
    const [solicitudes, tipoCambio] = await Promise.all([rpc("listar_solicitudes",{p_token:S.token}), rpc("tc_actual")]);
    if(numero!==solicitudCarga || !S) return false;
    DATA = solicitudes;
    TC = tipoCambio;
    ultimaCarga = new Date();
    estadoCarga(false);
    await sincronizarAvisos();
    return numero===solicitudCarga && Boolean(S);
  }catch(e){
    if(numero!==solicitudCarga) return false;
    estadoCarga(true);
    if(/Sesión|expirada/i.test(e.message)){
      clearInterval(poll);
      sessionStorage.removeItem("liumaq_req");
      aviso("Tu sesión expiró, vuelve a entrar.");
      setTimeout(()=>location.reload(),1500);
    }
    return false;
  }
}
async function sondeo(){
  if(!S || !await cargarDatos()) return;
  const ocupado = vista==="nueva" || vista==="admin" || !$("modal").classList.contains("hidden") || ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName);
  if(ocupado) pintarTabs(); else render();
}

async function recargar(){
  if(!poll) poll = setInterval(sondeo, 30000);
  if(await cargarDatos()) render();
}
function render(){
  pintarTabs();
  const filtros = Object.fromEntries([...$("v-app").querySelectorAll('[id^="f-"]')]
    .map(campo=>[campo.id,campo.value]));
  const v = {trabajo:vTrabajo, nueva:vNueva, mias:vMias, aprobar:vAprobar, comprar:vComprar, local:vLocal, recibir:vRecibir, osen:vOsen, admin:vAdmin}[vista];
  $("v-app").innerHTML = v ? v() : '<div class="empty">Sin opciones para tu usuario.</div>';
  if(vista==="nueva") filaPartida();
  if(vista==="admin") adminCargar();
  for(const [id,valor] of Object.entries(filtros)){
    if($(id)) $(id).value = valor;
  }
  if(vista==="osen") pintarOsen();
  else if(LISTAS[vista] && $("t-"+vista)) render2(vista);
}

// ---------- nueva solicitud ----------
function vNueva(){
  return `<div class="card"><h2>Nueva solicitud</h2>
  <div class="g">
    <div><label>Empresa</label><select id="n-emp">${EMPRESAS.map(e=>`<option>${e}</option>`).join("")}</select></div>
    <div><label>OSEN <span class="req">*</span></label><input id="n-osen" placeholder="OSEN-2836"></div>
    <div><label>Prioridad</label><select id="n-pri"><option value="normal">Normal</option><option value="urgente">Urgente (equipo parado)</option></select></div>
    <div><label for="n-fecha">Fecha requerida <span class="req">*</span></label><input type="date" id="n-fecha" required></div>
  </div>
  <label>Partidas</label>
  <div class="tbl"><table><thead><tr><th>Descripción *</th><th>No. parte</th><th style="width:80px">Cant.</th><th style="width:90px">Moneda</th><th style="width:120px">Precio estimado</th><th></th></tr></thead><tbody id="n-partidas"></tbody></table></div>
  <br><button class="ghost" onclick="filaPartida()">+ Partida</button>
  <label>Notas</label><textarea id="n-notas" rows="2"></textarea>
  <p class="mut">Si el total pasa de US$${esc(TC.umbral_usd||10000)} se manda a aprobación de Gabriel.</p>
  <button class="btn" onclick="guardarNueva()">Enviar solicitud</button></div>`;
}
function filaPartida(){
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><input class="pd"></td><td><input class="pn"></td><td><input class="pc" type="number" min="0" step="any" value="1"></td>
   <td><select class="pm"><option>MXN</option><option>USD</option></select></td><td><input class="pp" type="number" min="0" step="any"></td>
   <td><button class="ghost sm" onclick="this.closest('tr').remove()">✕</button></td>`;
  $("n-partidas").appendChild(tr);
}
async function guardarNueva(){
  if(!$("n-fecha").reportValidity()) return;
  const osen = $("n-osen").value.trim();
  if(!osen){ aviso("La OSEN es obligatoria."); $("n-osen").focus(); return; }
  const partidas = [...$("n-partidas").querySelectorAll("tr")].map(tr=>({
    descripcion: tr.querySelector(".pd").value.trim(), no_parte: tr.querySelector(".pn").value.trim(),
    cantidad: tr.querySelector(".pc").value, moneda: tr.querySelector(".pm").value, precio: tr.querySelector(".pp").value
  })).filter(p=>p.descripcion);
  if(!partidas.length){ aviso("Agrega al menos una partida con descripción."); return; }
  try{
    const r = await rpc("crear_solicitud", {p_token:S.token, p:{empresa:$("n-emp").value, osen, prioridad:$("n-pri").value,
      fecha_requerida:$("n-fecha").value, notas:$("n-notas").value, partidas}});
    await recargar(); vista="mias"; render(); aviso(`Solicitud ${r.folio} enviada.`, true);
  }catch(e){ aviso(e.message); }
}

// ---------- tablas comunes ----------
function filtroBar(id){
  return `<div class="bar"><div style="flex:1"><label>Buscar (folio, OSEN, proveedor, partida)</label><input id="f-${id}" oninput="render2('${id}')" placeholder="Ej. OSEN-2836"></div>
  <div><button class="ghost" onclick="exportar('${id}')">Exportar Excel</button></div>
  ${tiene("solicitar")?`<div><button class="ghost" onclick="importarUI()">Importar Excel</button></div>`:""}</div>`;
}
function aplicaFiltro(list, id){
  const t = ($("f-"+id)?.value||"").toLowerCase().trim();
  const plazo = id==="trabajo" ? $("f-trabajo-plazo")?.value : "";
  if(plazo){
    const hoy = hoyMexico();
    list = list.filter(s=>plazo==="urgente" ? s.prioridad==="urgente" : alertaPlazo(s,hoy)?.clave===plazo);
  }
  if(!t) return list;
  return list.filter(s => [s.folio,s.osen,s.proveedor,s.solicita_nombre,s.empresa, ...(s.partidas||[]).map(p=>p.descripcion+" "+(p.no_parte||""))].join(" ").toLowerCase().includes(t));
}

}

// ---------- vistas ----------
function hoyMexico(){
  const partes = new Intl.DateTimeFormat("es-MX",{timeZone:"America/Mexico_City",year:"numeric",month:"2-digit",day:"2-digit"})
    .formatToParts(new Date());
  const fecha = Object.fromEntries(partes.map(p=>[p.type,p.value]));
  return `${fecha.year}-${fecha.month}-${fecha.day}`;
}
const fechaHora = valor => valor ? new Intl.DateTimeFormat("es-MX",{
  timeZone:"America/Mexico_City",dateStyle:"short",timeStyle:"short"
}).format(new Date(valor)) : "—";
const diasEntre = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const textoDias = cantidad => `${cantidad} ${cantidad===1?"día":"días"}`;
function alertaPlazo(s,hoy){
  if(["recibido","rechazada","cancelada"].includes(s.estatus)) return null;
  const quedan = s.fecha_requerida ? diasEntre(hoy,s.fecha_requerida) : null;
  const llegada = s.fecha_tentativa ? diasEntre(hoy,s.fecha_tentativa) : null;
  const margen = llegada!==null && quedan!==null ? quedan-llegada : null;
  const cuenta = quedan===null ? "Sin fecha requerida" : quedan<0 ? `${textoDias(-quedan)} de atraso` :
    quedan===0 ? "Se requiere hoy" : `Faltan ${textoDias(quedan)} para la fecha requerida`;
  if(quedan!==null && quedan<0) return {clave:"atrasado",etiqueta:"Atrasado",detalle:cuenta};
  if(llegada!==null && llegada<0) return {clave:"atrasado",etiqueta:"Atrasado",detalle:`Llegada vencida hace ${textoDias(-llegada)} · ${cuenta}`};
  if(margen!==null && margen<0) return {clave:"atrasado",etiqueta:"Atrasado previsto",detalle:`Llegada ${textoDias(-margen)} después de la fecha requerida · ${cuenta}`};
  if(quedan===null) return {clave:"sin_fecha",etiqueta:"Sin fecha requerida",detalle:""};
  if(quedan<=2 || (margen!==null && margen<=2)) return {clave:"justo",etiqueta:"Justo de tiempo",detalle:cuenta};
  return {clave:"tiempo",etiqueta:"En tiempo",detalle:cuenta};
}
function fechasPedido(s,hoy){
  const plazo = alertaPlazo(s,hoy);
  const colores = {atrasado:"st-rechazada",justo:"st-por_aprobar",tiempo:"st-recibido",sin_fecha:""};
  const creado = s.created_at ? new Date(s.created_at).toLocaleDateString("sv-SE",{timeZone:"America/Mexico_City"}) : null;
  const antiguedad = plazo && creado ? ` · ${textoDias(Math.max(0,diasEntre(creado,hoy)))} abierto` : "";
  return `<div class="mut">Creado ${fechaHora(s.created_at)}${antiguedad}</div>
    <div class="mut">Llegada tentativa ${s.fecha_tentativa?fecha(s.fecha_tentativa):"por definir"}</div>
    <div class="mut">Requerida ${fecha(s.fecha_requerida)}</div>
    ${plazo?`<span class="p ${colores[plazo.clave]}">${plazo.etiqueta}</span><div class="mut">${plazo.detalle}</div>`:""}`;
}
function tiempoEnEtapa(inicio){
  const dias = Math.max(0,Math.floor((Date.now()-Date.parse(inicio))/86400000));
  return dias===0 ? "Menos de un día en esta etapa" : dias===1 ? "1 día en esta etapa" : `${dias} días en esta etapa`;
}

function csvCampo(v){ return '"' + String(v ?? "").replace(/"/g,'""') + '"'; }
function exportar(id){
  let list = id==="todo" ? DATA : aplicaFiltro(LISTAS[id]?.list||DATA, id);
  const H = ["Folio","OSEN","Empresa","Prioridad","Fecha","Solicita","Tipo","Proveedor","Estatus","Descripcion","No_parte","Cantidad","Recibido","Moneda","Precio","Total_solicitud_MXN","Total_solicitud_USD"];
  const rows = [H.map(csvCampo).join(",")];
  list.forEach(s => s.partidas.forEach(p => rows.push([s.folio,s.osen,s.empresa,s.prioridad,fecha(s.created_at),s.solicita_nombre,s.tipo,s.proveedor,ESTATUS[s.estatus],

  descargar("pedidos_" + new Date().toISOString().slice(0,10) + ".csv", "﻿" + rows.join("\r\n"));
}

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','||c===';'){row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!=='\r') f+=c; }
  if(f||row.length){row.push(f);rows.push(row);}
  const h = (rows.shift()||[]).map(x=>x.replace(/^﻿/,"").trim().toLowerCase());
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}
async function importar(){
  const file = $("imp-file").files[0]; if(!file){ alert("Elige un archivo CSV"); return; }
  const filas = parseCSV(await file.text());
  if(!filas.length){ alert("El CSV no tiene partidas."); return; }
  const g = Object.create(null);
  for(const [indice,r] of filas.entries()){
    const osen = (r.osen||"").trim();
    if(!osen){ alert("Hay filas sin OSEN. La OSEN es obligatoria."); return; }
    const empresa = r.empresa||"Liumaq", prioridad = (r.prioridad||"normal").toLowerCase();
    const moneda = (r.moneda||"MXN").toUpperCase(), cantidad = Number(r.cantidad||1), precio = Number(r.precio||0);
    if(!r.descripcion || !EMPRESAS.includes(empresa) || !["normal","urgente"].includes(prioridad) ||
      !["MXN","USD"].includes(moneda) || !Number.isFinite(cantidad) || cantidad<=0 || !Number.isFinite(precio) || precio<0){
      alert(`Revisa la partida ${indice+1}: descripción, empresa, prioridad, moneda, cantidad y precio.`);
      return;
    }
    const grupo = g[osen] ||= {osen,empresa,prioridad,partidas:[]};
    if(grupo.empresa!==empresa || grupo.prioridad!==prioridad){
      alert(`Las filas de ${osen} deben tener la misma empresa y prioridad.`);
      return;
    }
    grupo.partidas.push({descripcion:r.descripcion, no_parte:r.no_parte, cantidad, moneda, precio});
  }
  if(!confirm(`Importar ${Object.keys(g).length} solicitud(es) con ${filas.length} partida(s)?`)) return;
  try{ const n = await rpc("importar_solicitudes",{p_token:S.token,p:Object.values(g)}); cerrarModal(); await recargar(); aviso(`${n} solicitud(es) importadas.`, true); }
  catch(e){ alert(e.message); }
}

}
async function adminCargar(){
  const b = $("adm-body");
  if(ADM.sec==="pedidos"){
    b.innerHTML = `<h2>Pedidos</h2>` + tablaLista("adm", DATA, s=>`<button class="ghost sm" onclick="adminEditar(${s.id})">Editar</button> <button class="ghost sm bad" onclick="adminBorrar(${s.id},'${esc(s.folio)}')">Borrar</button>`);
  }else if(ADM.sec==="usuarios"){
    try{ ADM.usuarios = await rpc("admin_usuarios",{p_token:S.token}); }catch(e){ b.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    b.innerHTML = `<h2>Usuarios y roles</h2><div class="tbl"><table><thead><tr><th>Nombre</th><th>Puesto</th><th>Permisos</th><th>Activo</th><th></th></tr></thead><tbody>
    ${ADM.usuarios.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.puesto||"")}</td><td>${u.permisos.map(p=>esc(PERMISOS[p]||p)).join(", ")}</td><td>${u.activo?"Sí":"No"}</td>
     <td><button class="ghost sm" onclick="adminUsuario(${u.id})">Editar</button></td></tr>`).join("")}</tbody></table></div><br>
    <button class="btn" onclick="adminUsuario(null)">+ Nuevo usuario</button>`;
  }else{
    b.innerHTML = `<h2>Tipo de cambio y montos</h2>
    <p>Tipo de cambio actual: <b>$${esc(TC.valor||"—")}</b> (${fecha(TC.fecha)}, ${esc(TC.fuente||"")}). Se actualiza solo cada día desde Banxico (el mismo que publica el DOF).</p>
    <div class="g"><div><label>Poner tipo de cambio de hoy a mano</label><input id="a-tc" type="number" step="0.0001" placeholder="${esc(TC.valor||"")}"></div>
    <div><label>Monto que requiere aprobación (USD)</label><input id="a-um" type="number" value="${esc(TC.umbral_usd||10000)}"></div>
    <div><label>Nuevo código maestro (opcional)</label><input id="a-ma" type="password"></div></div><br>
    <button class="btn" onclick="adminGuardarConfig()">Guardar</button>`;
  }
}
async function adminGuardarConfig(){
  try{ await rpc("admin_config",{p_token:S.token,p_umbral:$("a-um").value||null,p_tc:$("a-tc").value||null,p_maestra:$("a-ma").value||null});
    await recargar(); aviso("Guardado.", true); }catch(e){ aviso(e.message); }
}
function adminUsuario(id){
  const u = ADM.usuarios.find(x=>x.id===id) || {nombre:"",puesto:"",permisos:["solicitar"],activo:true};
  abrirModal(`<h2>${id?"Editar":"Nuevo"} usuario</h2><div class="g">
  <div><label>Nombre</label><input id="u-n" value="${esc(u.nombre)}"></div><div><label>Puesto</label><input id="u-p" value="${esc(u.puesto||"")}"></div>
  <div><label>${id?"Nuevo código (vacío = no cambia)":"Código"}</label><input id="u-c" type="password"></div></div>
  <label>Permisos</label>${Object.entries(PERMISOS).map(([k,v])=>`<label class="chk"><input type="checkbox" class="u-perm" value="${k}" ${u.permisos.includes(k)?"checked":""}>${v}</label>`).join("")}
  <label class="chk"><input type="checkbox" id="u-a" ${u.activo?"checked":""}>Activo</label><br><br>
  <button class="btn" onclick="adminGuardarUsuario(${id})">Guardar</button> <button class="ghost" onclick="cerrarModal()">Cancelar</button>`);
}
async function adminGuardarUsuario(id){
  const p = {id, nombre:$("u-n").value.trim(), puesto:$("u-p").value.trim(), codigo:$("u-c").value,
    permisos:[...document.querySelectorAll(".u-perm:checked")].map(x=>x.value), activo:$("u-a").checked};
  if(!p.nombre){ alert("Pon el nombre"); return; }
  try{ await rpc("admin_guardar_usuario",{p_token:S.token,p}); cerrarModal(); adminCargar(); aviso("Usuario guardado.", true); }catch(e){ alert(e.message); }
}
function adminEditar(id){
  const s = DATA.find(x=>x.id===id);
  abrirModal(`<h2>Editar ${esc(s.folio)}</h2><div class="g">
  <div><label>Empresa</label><select id="e-emp">${EMPRESAS.map(e=>`<option ${s.empresa===e?"selected":""}>${e}</option>`).join("")}</select></div>
  <div><label>OSEN *</label><input id="e-osen" value="${esc(s.osen)}"></div>
  <div><label>Prioridad</label><select id="e-pri"><option value="normal">Normal</option><option value="urgente" ${s.prioridad==="urgente"?"selected":""}>Urgente</option></select></div>
  <div><label>Fecha requerida</label><input id="e-fr" type="date" value="${esc(s.fecha_requerida||"")}"></div>
  <div><label for="e-llegada">Llegada tentativa a almacén</label><input id="e-llegada" type="date" value="${esc(s.fecha_tentativa||"")}"></div>
  <div><label>Tipo</label><select id="e-tipo"><option value="">—</option><option value="local" ${s.tipo==="local"?"selected":""}>Local</option><option value="internacional" ${s.tipo==="internacional"?"selected":""}>Internacional</option></select></div>
  <div><label>Proveedor</label><input id="e-prov" value="${esc(s.proveedor||"")}"></div>
  <div><label>Estatus</label><select id="e-est">${Object.entries(ESTATUS).map(([k,v])=>`<option value="${k}" ${s.estatus===k?"selected":""}>${v}</option>`).join("")}</select></div>
  <div><label>Tipo de cambio</label><input id="e-tc" type="number" step="0.0001" value="${esc(s.tc||"")}"></div></div>
  <label>Partidas</label><div class="tbl"><table><thead><tr><th>Descripción</th><th>No. parte</th><th>Cant.</th><th>Recibido</th><th>Moneda</th><th>Precio</th><th></th></tr></thead><tbody id="e-parts">
  ${s.partidas.map(p=>filaEdit(p)).join("")}</tbody></table></div><br>
  <button class="ghost" onclick="$('e-parts').insertAdjacentHTML('beforeend', filaEdit({}))">+ Partida</button>
  <label>Notas</label><textarea id="e-notas" rows="2">${esc(s.notas||"")}</textarea><br><br>
  <button class="btn" onclick="adminGuardarSol(${id})">Guardar</button> <button class="ghost" onclick="cerrarModal()">Cancelar</button>`);
}
function filaEdit(p){
  return `<tr><td><input class="ed" value="${esc(p.descripcion||"")}"></td><td><input class="en" value="${esc(p.no_parte||"")}"></td>
  <td><input class="ec" type="number" step="any" value="${p.cantidad??1}"></td><td><input class="er" type="number" step="any" value="${p.cantidad_recibida??0}"></td>
  <td><select class="em"><option ${p.moneda!=="USD"?"selected":""}>MXN</option><option ${p.moneda==="USD"?"selected":""}>USD</option></select></td>
  <td><input class="ep" type="number" step="any" value="${p.precio??0}"></td><td><button class="ghost sm" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
}
async function adminGuardarSol(id){
  const partidas = [...$("e-parts").querySelectorAll("tr")].map(tr=>({descripcion:tr.querySelector(".ed").value.trim(), no_parte:tr.querySelector(".en").value,
    cantidad:tr.querySelector(".ec").value, cantidad_recibida:tr.querySelector(".er").value, moneda:tr.querySelector(".em").value, precio:tr.querySelector(".ep").value})).filter(p=>p.descripcion);
  const p = {id, empresa:$("e-emp").value, osen:$("e-osen").value, prioridad:$("e-pri").value, fecha_requerida:$("e-fr").value, fecha_tentativa:$("e-llegada").value, tipo:$("e-tipo").value,
    proveedor:$("e-prov").value, estatus:$("e-est").value, tc:$("e-tc").value, notas:$("e-notas").value, partidas};
  if(!p.osen.trim()){ alert("La OSEN es obligatoria"); return; }
  try{ await rpc("admin_guardar_solicitud",{p_token:S.token,p}); cerrarModal(); await recargar(); aviso("Pedido guardado.", true); }catch(e){ alert(e.message); }
}
async function adminBorrar(id, folio){
  if(!confirm(`¿Borrar ${folio} definitivamente?`)) return;
  try{ await rpc("admin_borrar_solicitud",{p_token:S.token,p_id:id}); await recargar(); aviso("Borrado.", true); }catch(e){ aviso(e.message); }
}
