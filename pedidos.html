<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FF5808">
<title>Pedidos - Requisiciones</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --accent:#1b3a6b;
    --accent-dark:#122a4d;
    --accent-soft:#eef2f8;
    --ink:#1c1f26;
    --muted:#6b7280;
    --border:#d8dde3;
    --bg:#f4f6f9;
    --card:#ffffff;
    --danger:#c0392b;
    --ok:#1a7a3c;
    --warn:#a8710a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:22px;margin:0;color:var(--accent-dark);}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  a{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;}

  .id-overlay{position:fixed;inset:0;background:rgba(15,20,30,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .id-overlay.hidden{display:none;}
  .id-box{background:#fff;border-radius:var(--radius);padding:26px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .id-box input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:4px;}
  .id-box label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:12px;}
  button{font-family:inherit;cursor:pointer;}
  .primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .ghost{background:none;border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;color:var(--ink);}
  .secondary{background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;border-top:4px solid var(--accent);}
  .stat .n{font-size:24px;font-weight:700;color:var(--accent-dark);}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px;}
  .filters > div{display:flex;flex-direction:column;gap:4px;}
  .filters label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .filters select, .filters input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--accent-soft);color:var(--accent-dark);text-align:left;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:hover td{background:#fafbfd;}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;}
  .badge.origen-internacional{background:#e6ecf8;color:var(--accent-dark);}
  .badge.origen-local{background:#eee4fb;color:#5b2a9e;}
  .estatus{display:inline-block;border-radius:5px;padding:3px 9px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-dark);}
  .estatus.pendiente{background:#fdf0d5;color:var(--warn);}
  .estatus.aprobada{background:#e3f3e9;color:var(--ok);}
  .estatus.rechazada{background:#fbe4e1;color:var(--danger);}
  .estatus.en_transito{background:#e6ecf8;color:var(--accent-dark);}
  .estatus.en_proceso_importacion{background:#eee4fb;color:#5b2a9e;}
  .estatus.completada{background:#dff3e6;color:var(--ok);}
  .empty{color:var(--muted);font-size:13px;padding:30px;text-align:center;}
  .aviso{background:#fdf0d5;border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;font-size:13px;color:var(--warn);font-weight:600;}
  .osen-link{background:none;border:none;padding:0;font:inherit;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;}
  .osen-modal{position:fixed;inset:0;background:rgba(15,20,30,0.55);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px;}
  .osen-modal.hidden{display:none;}
  .osen-modal-box{background:#fff;border-radius:var(--radius);padding:22px 24px;max-width:720px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .osen-modal-box h3{margin:0 0 4px;color:var(--accent-dark);}
  .osen-modal-box .cerrar{float:right;}
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="ui-polish.css">
  <script src="bot.js" data-brand="amex" data-app="requisiciones" defer></script>
</head>
<body>

<div id="gate-overlay" class="id-overlay">
  <div class="id-box">
    <h2 style="margin-top:0;">Pedidos</h2>
    <p style="font-size:13px;color:var(--muted);">Vista de solo lectura para Luis Fuentes: compras internacionales (Paco) y compras locales (Kirman/Ricardo) juntas.</p>
    <label>Código de acceso</label>
    <input type="password" id="gate-clave" placeholder="••••••">
    <div id="gate-error" style="color:var(--danger);font-size:12.5px;margin-top:8px;display:none;"></div>
    <button class="primary" style="margin-top:16px;width:100%;" onclick="entrarPanel()">Entrar</button>
  </div>
</div>

<div class="app" id="app-root" style="display:none;">

  <div class="header-row">
    <div>
      <h1>Pedidos</h1>
      <p class="sub">Todo lo que se ha pedido — internacional (Liugong/importación) y local — en una sola vista, solo lectura.</p>
    </div>
  </div>

  <div id="aviso-wrap"></div>
  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="filters">
      <div>
        <label>Origen</label>
        <select id="f-origen" onchange="renderTodo()">
          <option value="">Todos</option>
          <option value="internacional">Compras internacional (Paco)</option>
          <option value="local">Compras locales (Kirman/Ricardo)</option>
        </select>
      </div>
      <div>
        <label>OSEN</label>
        <select id="f-osen" onchange="renderTodo()">
          <option value="">Todos</option>
        </select>
      </div>
      <div>
        <label>Buscar (folio, descripción, solicita, OSEN)</label>
        <input type="text" id="f-texto" placeholder="Ej. filtro, LIU-2026 u OSEN-2637" oninput="renderTodo()">
      </div>
      <div>
        <button class="secondary" onclick="exportarCSV()">Exportar (Excel)</button>
      </div>
      <div>
        <button class="ghost" onclick="cargar()">Actualizar</button>
      </div>
    </div>

    <div id="tabla-wrap"><div class="empty">Cargando…</div></div>
  </div>

</div>

<div class="osen-modal hidden" id="osen-modal">
  <div class="osen-modal-box">
    <button class="ghost cerrar" onclick="cerrarOsenModal()">Cerrar</button>
    <h3 id="osen-modal-titulo">OSEN</h3>
    <p class="sub" style="margin-bottom:12px;">Todos los pedidos ligados a esta OSEN.</p>
    <div id="osen-modal-lista"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://iwnbscekenptumanpjcs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3bmJzY2VrZW5wdHVtYW5wamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzg2OTQsImV4cCI6MjA5NDg1NDY5NH0.7-YjXYAEXmkKGENNAWc99kplFrq7L8fQbPg1M0AhtNQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'amex_requisiciones' } });

const COMPANIES = { amex: "AMEX Machinery", aromata: "Grupo Aromata", liumaq: "Liumaq" };
const ESTATUS_LABEL = { pendiente:"Pendiente", aprobada:"Aprobada", rechazada:"Rechazada", liberacion_pago:"Liberación de pago", en_transito:"En tránsito", en_proceso_importacion:"En proceso de importación", completada:"Completo" };

let clave = null;
let unificado = [];

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function money(n){
  n = Number(n) || 0;
  return "$" + n.toLocaleString("es-MX", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function estatusSlug(s){
  return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"_");
}

// Extrae el número de OSEN de un texto libre, ej. "SERVICIO OSEN-2637" o "(OSEN 2637)" -> "2637".
function extraerOsen(texto){
  const m = String(texto||"").match(/OSEN[\s\-:]*([A-Za-z0-9\-]+)/i);
  return m ? m[1].replace(/[)\s]+$/,"") : "";
}

// Busca un valor en la fila por coincidencia parcial del encabezado (tolera mayúsculas/minúsculas
// y pequeños cambios de nombre, ej. "Proveedor" vs "Proveedor/DMS" vs "COMENTARIO").
function campo(row, patrones){
  const claves = Object.keys(row);
  for(const patron of patrones){
    for(const k of claves){
      if(k.toLowerCase().includes(patron)) return row[k];
    }
  }
  return "";
}

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      }else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* ignorar */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(v => String(v).trim() !== "")).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]||"").trim());
    return obj;
  });
}

async function entrarPanel(){
  const val = document.getElementById("gate-clave").value.trim();
  const err = document.getElementById("gate-error");
  if(!val){ err.textContent = "Escribe el código de acceso."; err.style.display="block"; return; }
  try{
    const { data, error } = await sb.rpc("verificar_clave_pedidos", { p_clave: val });
    if(error) throw error;
    if(!data){ err.textContent = "Código incorrecto."; err.style.display = "block"; return; }
    clave = val;
    sessionStorage.setItem("amex_pedidos_clave", val);
    document.getElementById("gate-overlay").classList.add("hidden");
    document.getElementById("app-root").style.display = "block";
    cargar();
  }catch(e){
    err.textContent = "Error de conexión: " + e.message;
    err.style.display = "block";
  }
}

async function cargar(){
  const wrap = document.getElementById("tabla-wrap");
  const aviso = document.getElementById("aviso-wrap");
  wrap.innerHTML = '<div class="empty">Cargando…</div>';
  aviso.innerHTML = "";
  unificado = [];

  try{
    const { data: intl, error: errIntl } = await sb.rpc("listar_requisiciones_resumen", { p_clave: clave });
    if(errIntl) throw errIntl;
    (intl||[]).forEach(r=>{
      unificado.push({
        origen: "internacional",
        empresa: COMPANIES[r.empresa] || r.empresa,
        folio: r.folio,
        fecha: r.fecha,
        solicita: r.creado_por || r.solicita,
        descripcion: r.motivo,
        total: Number(r.total)||0,
        estatus: r.estatus,
        estatusLabel: ESTATUS_LABEL[r.estatus] || r.estatus,
        osen: extraerOsen(r.motivo)
      });
    });
  }catch(e){
    aviso.innerHTML += '<div class="aviso">No se pudo cargar compras internacional: ' + escapeHtml(e.message) + '</div>';
  }

  try{
    const { data: url, error: errUrl } = await sb.rpc("obtener_sheet_locales_url", { p_clave: clave });
    if(errUrl) throw errUrl;
    if(!url){
      aviso.innerHTML += '<div class="aviso">Todavía no se ha conectado el Google Sheet de Compras Locales.</div>';
    }else{
      const resp = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now());
      if(!resp.ok) throw new Error("No se pudo leer el Google Sheet de Compras Locales.");
      const text = await resp.text();
      const localRows = parseCSV(text);
      localRows.forEach(r=>{
        const cant = parseFloat(campo(r,["cantidad"])) || 0;
        const precio = parseFloat(campo(r,["precio"])) || 0;
        const proveedor = campo(r,["proveedor"]);
        const osen = campo(r,["osen"]);
        let descripcion = (proveedor ? proveedor + " — " : "") + (campo(r,["descripcion"])||"");
        if(osen) descripcion += " (OSEN " + osen + ")";
        unificado.push({
          origen: "local",
          empresa: campo(r,["empresa"]),
          folio: campo(r,["folio"]),
          fecha: campo(r,["fecha"]),
          solicita: campo(r,["solicita"]),
          descripcion: descripcion,
          total: cant*precio,
          estatus: estatusSlug(campo(r,["estatus"])),
          estatusLabel: campo(r,["estatus"]),
          osen: osen || ""
        });
      });
    }
  }catch(e){
    aviso.innerHTML += '<div class="aviso">No se pudo cargar compras locales: ' + escapeHtml(e.message) + '</div>';
  }

  unificado.sort((a,b)=> String(b.fecha||"").localeCompare(String(a.fecha||"")));
  llenarFiltroOsen();
  renderTodo();
}

function llenarFiltroOsen(){
  const sel = document.getElementById("f-osen");
  const actual = sel.value;
  const osenes = Array.from(new Set(unificado.map(r=>r.osen).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">Todos</option>' + osenes.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
  if(osenes.includes(actual)) sel.value = actual;
}

function filtrar(){
  const origen = document.getElementById("f-origen").value;
  const osen = document.getElementById("f-osen").value;
  const texto = document.getElementById("f-texto").value.trim().toLowerCase();
  return unificado.filter(r=>{
    if(origen && r.origen !== origen) return false;
    if(osen && r.osen !== osen) return false;
    if(texto){
      const hay = [r.folio, r.descripcion, r.solicita, r.empresa, r.osen].join(" ").toLowerCase();
      if(!hay.includes(texto)) return false;
    }
    return true;
  });
}

function abrirOsen(osen){
  if(!osen) return;
  const lista = unificado.filter(r=>r.osen === osen);
  document.getElementById("osen-modal-titulo").textContent = "OSEN " + osen + " (" + lista.length + " pedido" + (lista.length===1?"":"s") + ")";
  const rowsHtml = lista.map(r=>{
    const origenLabel = r.origen === "internacional" ? "Internacional" : "Local";
    const origenClass = r.origen === "internacional" ? "origen-internacional" : "origen-local";
    return `<tr>
      <td><span class="badge ${origenClass}">${origenLabel}</span></td>
      <td>${escapeHtml(r.empresa)||"—"}</td>
      <td>${escapeHtml(r.folio)||"—"}</td>
      <td>${escapeHtml(r.fecha)||"—"}</td>
      <td>${escapeHtml(r.descripcion)||"—"}</td>
      <td style="text-align:right">${money(r.total)}</td>
      <td><span class="estatus ${r.estatus}">${escapeHtml(r.estatusLabel)||"—"}</span></td>
    </tr>`;
  }).join("");
  document.getElementById("osen-modal-lista").innerHTML = `<table>
    <thead><tr><th>Origen</th><th>Empresa</th><th>Folio</th><th>Fecha</th><th>Descripción</th><th style="text-align:right">Total</th><th>Estatus</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
  document.getElementById("osen-modal").classList.remove("hidden");
}
function cerrarOsenModal(){
  document.getElementById("osen-modal").classList.add("hidden");
}

function renderTodo(){
  const list = filtrar();
  renderStats(list);
  renderTabla(list);
}

function renderStats(list){
  let total = 0;
  const porOrigen = { internacional: 0, local: 0 };
  list.forEach(r=>{ total += r.total; porOrigen[r.origen] = (porOrigen[r.origen]||0)+1; });
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${list.length}</div><div class="l">Pedidos (vista actual)</div></div>
    <div class="stat"><div class="n">${porOrigen.internacional||0}</div><div class="l">Internacional</div></div>
    <div class="stat"><div class="n">${porOrigen.local||0}</div><div class="l">Locales</div></div>
    <div class="stat"><div class="n">${money(total)}</div><div class="l">Monto total</div></div>
  `;
}

function renderTabla(list){
  const wrap = document.getElementById("tabla-wrap");
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">No hay pedidos con estos filtros.</div>';
    return;
  }
  const rowsHtml = list.map(r=>{
    const origenLabel = r.origen === "internacional" ? "Internacional" : "Local";
    const origenClass = r.origen === "internacional" ? "origen-internacional" : "origen-local";
    const osenCell = r.osen
      ? `<button class="osen-link" onclick="abrirOsen('${r.osen.replace(/'/g,"\\'")}')">${escapeHtml(r.osen)}</button>`
      : "—";
    return `<tr>
      <td><span class="badge ${origenClass}">${origenLabel}</span></td>
      <td>${escapeHtml(r.empresa)||"—"}</td>
      <td>${escapeHtml(r.folio)||"—"}</td>
      <td>${escapeHtml(r.fecha)||"—"}</td>
      <td>${escapeHtml(r.solicita)||"—"}</td>
      <td>${escapeHtml(r.descripcion)||"—"}</td>
      <td style="text-align:right">${money(r.total)}</td>
      <td><span class="estatus ${r.estatus}">${escapeHtml(r.estatusLabel)||"—"}</span></td>
      <td>${osenCell}</td>
    </tr>`;
  }).join("");
  wrap.innerHTML = `<table>
    <thead><tr><th>Origen</th><th>Empresa</th><th>Folio</th><th>Fecha</th><th>Solicita</th><th>Descripción</th><th style="text-align:right">Total</th><th>Estatus</th><th>OSEN</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

function csvField(v){
  const s = String(v == null ? "" : v).replace(/"/g, '""');
  return '"' + s + '"';
}
function exportarCSV(){
  const list = filtrar();
  if(list.length === 0){ alert("No hay datos para exportar con estos filtros."); return; }
  const headers = ["Origen","Empresa","Folio","Fecha","Solicita","Descripción","Total","Estatus","OSEN"];
  const lines = [headers.map(csvField).join(",")];
  list.forEach(r=>{
    lines.push([
      r.origen === "internacional" ? "Internacional" : "Local",
      r.empresa, r.folio, r.fecha, r.solicita, r.descripcion, r.total, r.estatusLabel, r.osen
    ].map(csvField).join(","));
  });
  const csv = "﻿" + lines.join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  a.href = url;
  a.download = "pedidos_" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// init: si ya se validó la clave en esta pestaña, entra directo
const claveGuardada = sessionStorage.getItem("amex_pedidos_clave");
if(claveGuardada){
  document.getElementById("gate-clave").value = claveGuardada;
  entrarPanel();
}
</script>
</body>
</html>
